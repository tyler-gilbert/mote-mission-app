[package]
name = "sim"
version = "0.1.0"
edition = "2024"

[dependencies]
mote-api = { path ="../../../mote/mote-api" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
units = { package = "sci-units", version = "0.6", features = ["use_defmt", "f32"] }
